---
name: Check version

# Fail unless the tag that triggered the caller equals the version declared in
# every listed file (*.toml: [project] version; *.json: top-level version).
# The caller needs no extra permission (`contents: read`).
on:
  workflow_call:
    inputs:
      files:
        description: Space-separated files declaring the version.
        type: string
        default: pyproject.toml frontend/package.json

permissions: {}

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches version
        env:
          FILES: ${{ inputs.files }}
        run: |
          status=0
          for file in $FILES; do
            case $file in
              *.toml) version=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$file") ;;
              *.json) version=$(jq -r .version "$file") ;;
              *) echo "::error::Unsupported version file $file"; exit 1 ;;
            esac
            if [ "$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error file=$file::Tag $GITHUB_REF_NAME does not match version $version"
              status=1
            fi
          done
          exit $status
