---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Render the templates
        run: |
          for family in ha py web; do
            mkdir -p "$RUNNER_TEMP/templates/$family"
            for f in "$family"/templates/workflows/*.yml "$family"/templates/once/*.yml; do
              [ -f "$f" ] || continue
              sed -e 's/{{BRANCH}}/main/g' -e 's/{{DOMAIN}}/example/g' \
                -e 's/{{IMAGE}}/example/g' -e 's/{{TITLE}}/Example/g' -e 's/{{DESCRIPTION}}/Example/g' \
                -e 's/{{PORT}}/8000/g' -e 's/{{BACKEND_DIR}}/backend/g' \
                -e 's/{{VERSION_FILES}}/backend\/pyproject.toml frontend\/package.json/g' "$f" \
                >"$RUNNER_TEMP/templates/$family/$(basename "$f")"
            done
          done

      - name: Run actionlint
        run: uvx --from actionlint-py actionlint .github/workflows/*.yml "$RUNNER_TEMP"/templates/*/*.yml

      - name: Check sync scripts
        run: bash -n ha/sync.sh py/sync.sh web/sync.sh
