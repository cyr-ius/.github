---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Render the Home Assistant templates
        run: |
          mkdir -p "$RUNNER_TEMP/templates"
          for f in ha/templates/workflows/*.yml; do
            sed -e 's/{{BRANCH}}/main/g' -e 's/{{DOMAIN}}/example/g' "$f" \
              >"$RUNNER_TEMP/templates/$(basename "$f")"
          done

      - name: Run actionlint
        run: uvx --from actionlint-py actionlint .github/workflows/*.yml "$RUNNER_TEMP"/templates/*.yml

      - name: Check sync.sh
        run: bash -n ha/sync.sh
