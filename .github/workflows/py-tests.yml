---
name: Python tests

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON list of Python versions to test.
        type: string
        default: '["3.14", "3.15"]'
      extras:
        description: Space-separated project extras installed for the tests.
        type: string
        default: dev

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        env:
          EXTRAS: ${{ inputs.extras }}
        run: |
          args=()
          for extra in $EXTRAS; do
            args+=(--extra "$extra")
          done
          uv sync "${args[@]}"

      - name: Run pytest
        run: uv run pytest
