---
name: Web documentation

# Build the MkDocs site and, except on pull requests, deploy it to GitHub Pages.
# The caller must grant `contents: read`, `pages: write` and `id-token: write`.
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version running MkDocs.
        type: string
        default: "3.14"
      build:
        description: Shell commands building the site into site/.
        type: string
        default: uv run --no-project --with-requirements docs/requirements.txt mkdocs build --strict

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the git-revision-date plugin
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - name: Build the site
        run: ${{ inputs.build }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
